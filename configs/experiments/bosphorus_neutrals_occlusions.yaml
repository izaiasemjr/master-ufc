# Main Bosphorus protocol: neutral gallery plus occluded probes.
id: bosphorus-neutrals-occlusions
dataset: bosphorus

samples:
  groups: [neutral, occlusion]

pipeline:
  stages: [preprocessing, reference_mask, registration, landmarks, crop, keypoints, feature_extraction, matching, classification, evaluation]

execution:
  workers: 1
  fail_fast: false

preprocessing:
  outlier_removal:
    radius: 5.0
    min_points: 10
  voxel_grid:
    leaf_size: [2.0, 2.0, 2.0]

registration:
  target_suffix: N_N_0
  processing:
    fields: [x, y, z]
    partitions: 2
    icp:
      transformation_epsilon: 0.001
      max_iterations: 100
    occlusion:
      enabled: true
      threshold: 8.0
      penalty: 1
      restoration_threshold: 1.0
    debug: false

crop:
  landmark_index: 13
  crop_radius: 80.0
  offset: [0.0, 0.0, 0.0]

keypoints:
  radial_grids:
    - [normal, 15, 11, 11, 6]
    - [normal, 30, 11, 11, 6]
    - [normal, 60, 11, 11, 6]
    - [sparse, 15, 11, 11, 6]
    - [sparse, 30, 11, 11, 6]
    - [sparse, 10, 16, 11, 6]
  detectors:
    - [sift_normal, 10, 4, 7, 8, 0.0001]
    - [iss, 10, 5, 0.975, 0.0975, 5, 5]

feature_extraction:
  variants:
    sparse_15:
      keypoint_family: grids
      keypoint_method: sparse_15_11_11_6
      normal_radius: 10.0
      feature_radius: 25.0
    sift:
      keypoint_family: detectors
      keypoint_method: sift_normal_10_4_7_8_0.0001
      normal_radius: 10.0
      feature_radius: 25.0
    iss:
      keypoint_family: detectors
      keypoint_method: iss_10_5_0.975_0.0975_5_5
      normal_radius: 10.0
      feature_radius: 25.0

# This local Bosphorus subset defines its gallery and probe population from the
# descriptors found. Add expected_count only when a fixed protocol is intended;
# selectors can also use subject_regex, type_regex, expression_regex, and
# sample_regex.
# L1 is used consistently in correspondence search and score aggregation.
matching:
  mode: paper
  k_values: [2, 5, 10, 20, 30, 40, 50, 1000000]
  rank_max: 20
  gallery:
    type: N
    expression: N
    sample: 0
  probes:
    categories:
      N:
        type: N
        expression: N
      O_EYE:
        type: O
        expression: EYE
      O_GLASSES:
        type: O
        expression: GLASSES
      O_MOUTH:
        type: O
        expression: MOUTH
      O_HAIR:
        type: O
        expression: HAIR
  variants:
    sparse_15:
      correspondence: fixed
    sift:
      correspondence: dynamic
    iss:
      correspondence: dynamic
