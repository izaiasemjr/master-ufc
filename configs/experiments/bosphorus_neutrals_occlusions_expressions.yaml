# Extended Bosphorus protocol: neutral gallery, neutral/occlusion/expression probes.
id: bosphorus-neutrals-occlusions-expressions
dataset: bosphorus

samples:
  groups: [neutral, occlusion, expression]

pipeline:
  stages: [preprocessing, reference_mask, registration, landmarks, crop, keypoints, feature_extraction, matching, classification, evaluation, visualization]

execution:
  workers: 1
  fail_fast: false

preprocessing:
  outlier_removal:
    radius: 5.0
    min_points: 10
  voxel_grid:
    leaf_size: [2.0, 2.0, 2.0]

registration:
  target_suffix: N_N_0
  processing:
    fields: [x, y, z]
    partitions: 2
    icp:
      transformation_epsilon: 0.001
      max_iterations: 100
    occlusion:
      enabled: false
      threshold: 8.0
      penalty: 1
      restoration_threshold: 1.0
    debug: false

crop:
  landmark_index: 13
  crop_radius: 80.0
  offset: [0.0, 0.0, 0.0]

keypoints:
  radial_grids:
    - [normal, 15, 11, 11, 6]
    - [normal, 30, 11, 11, 6]
    - [normal, 60, 11, 11, 6]
    - [sparse, 15, 11, 11, 6]
    - [sparse, 30, 11, 11, 6]
    - [sparse, 10, 16, 11, 6]
  detectors:
    - [sift_normal, 10, 4, 7, 8, 0.0001]
    - [iss, 10, 5, 0.975, 0.0975, 5, 5]

feature_extraction:
  variants:
    sparse_15:
      keypoint_family: grids
      keypoint_method: sparse_15_11_11_6
      normal_radius: 10.0
      feature_radius: 25.0
    sift:
      keypoint_family: detectors
      keypoint_method: sift_normal_10_4_7_8_0.0001
      normal_radius: 10.0
      feature_radius: 25.0
    iss:
      keypoint_family: detectors
      keypoint_method: iss_10_5_0.975_0.0975_5_5
      normal_radius: 10.0
      feature_radius: 25.0

# Fixed local protocol: 105 gallery samples and 1028 probes (575 original
# neutral/occlusion probes plus 453 expression samples). Counts guard against
# silently evaluating an incomplete descriptor population.
# L1 is used consistently in correspondence search and score aggregation.
matching:
  mode: paper
  aggregation: mean
  k_values: [2, 5, 10, 20, 30, 40, 50, 1000000]
  rank_max: 20
  gallery:
    expected_count: 105
    type: N
    expression: N
    sample: 0
  probes:
    expected_count: 1028
    categories:
      N:
        expected_count: 194
        type: N
        expression: N
        sample_regex: "[1-9][0-9]*"
      O_EYE:
        expected_count: 105
        type: O
        expression: EYE
      O_GLASSES:
        expected_count: 104
        type: O
        expression: GLASSES
      O_MOUTH:
        expected_count: 105
        type: O
        expression: MOUTH
      O_HAIR:
        expected_count: 67
        type: O
        expression: HAIR
      E_ANGER:
        expected_count: 71
        type: E
        expression: ANGER
      E_DISGUST:
        expected_count: 69
        type: E
        expression: DISGUST
      E_FEAR:
        expected_count: 70
        type: E
        expression: FEAR
      E_HAPPY:
        expected_count: 106
        type: E
        expression: HAPPY
      E_SADNESS:
        expected_count: 66
        type: E
        expression: SADNESS
      E_SURPRISE:
        expected_count: 71
        type: E
        expression: SURPRISE
  variants:
    sparse_15:
      correspondence: fixed
      # Retain the full sorted L1 distribution for the radial-grid study.
      export_pair_distances: true
    sift:
      correspondence: dynamic
    iss:
      correspondence: dynamic

# Figures are written below evaluation/visualization/ in this experiment's
# result tree. Values reproduce the historical fixed-k CMC choices.
visualization:
  formats: [png]
  dpi: 300
  cmc_k:
    sparse_15: 30
    sift: 20
    iss: 50
  variant_labels:
    sparse_15: Radial Grid
    sift: SIFT
    iss: ISS
  category_labels:
    N: Neutral
    O_EYE: Eye
    O_GLASSES: Glasses
    O_MOUTH: Mouth
    O_HAIR: Hair
    O_ALL: O All
    ALL: All
    E_ANGER: Anger
    E_DISGUST: Disgust
    E_FEAR: Fear
    E_HAPPY: Happy
    E_SADNESS: Sadness
    E_SURPRISE: Surprise
